delete_account:
  _: アカウント削除
  final_warning: 最終警告
  warnings:
    intro: アカウントを削除しようとしています。アカウントは論理削除され、復元できません。
    username: ユーザー名は変更され、特別な形式で保存されます。元のユーザー名で新しいアカウントを登録できます。
    email: メールアドレスの紐付けが解除され、消去されます。元のメールアドレスで新しいアカウントを登録できます。
    idp: すべての ID プロバイダー連携が解除され、別のアカウントで使用できるようになります。
    data: 関連する大会、チーム、提出データは保持されます。ただし、削除後はこれらのデータがあなたのものだと証明する情報がなくなります。
    irreversible: 以下の操作は元に戻せませんので、もう一度ご注意ください！先に進む前によく考えてください！
    confirm: 上記の内容をよくお読みください。本当にアカウントを削除する場合は、以下にユーザー名とパスワードを入力して「確認」をクリックしてください。
  form:
    username:
      _: ユーザー名
      messages:
        _: ユーザー名を入力してください
        match: ユーザー名が一致しません
    password:
      _: パスワード
      message: パスワードを入力してください
    captcha:
      _: CAPTCHA
      message: CAPTCHA を入力してください。
  actions:
    delete:
      success: アカウントを削除しました。
