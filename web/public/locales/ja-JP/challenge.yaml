search:
  title: 課題タイトル
  tag: タグ
  public:
    _: 公開状態
    'true': 公開
    'false': 非公開
form:
  id:
    _: ID
  title:
    _: タイトル
    message: タイトルを入力してください
    placeholder: ハッキングしてみて！
  category:
    _: カテゴリ
    message: カテゴリを選択してください
  tags:
    _: タグ
  has_attachment:
    _: 添付ファイルあり
    'true': はい
    'false': いいえ
  has_instance:
    _: 動的環境
    'true': 動的
    'false': 静的
  description:
    _: 説明
    message: 説明を入力してください
    placeholder: 昔々…
  has_writeup:
    _: 解答レポートあり
    'true': はい
    'false': いいえ
  writeup:
    _: 解答レポート
    message: 解答レポートを入力してください
    placeholder: 昔々…
  instance:
    duration:
      _: 有効期間（秒）
      message: 有効期間を秒単位で入力してください
      placeholder: '1800'
    internet:
      _: インターネットアクセスを許可する
      message: インターネットアクセスを許可するかどうかを選択してください
      'true': はい
      'false': いいえ
    containers:
      _: コンテナ
      image:
        _: イメージ
        message: コンテナイメージを入力してください
        placeholder: repository:tag
      cpu_limit:
        _: CPU制限（コア）
        message: コア単位でCPU制限を入力してください
      memory_limit:
        _: メモリ制限（MB）
        message: メモリ制限を MB 単位で入力してください
      image_pull_policy:
        _: イメージ取得ポリシー
        message: イメージ取得ポリシーを選択してください
        always: 常に取得
        if_not_present: 存在しない場合のみ取得
        never: 取得しない
      ports:
        _: 公開ポート
        port:
          _: ポート
          message: ポート番号を入力してください
        protocol:
          _: プロトコル
          tcp: TCP
          udp: UDP
      envs:
        _: 環境変数
        key:
          _: キー
          message: 環境変数キーを入力してください
        value:
          _: 値
          message: 環境変数の値を入力してください
      actions:
        delete: コンテナの削除
        add: コンテナを追加
actions:
  _: 操作
  create:
    _: 課題を作成
    success: 課題 {{title}} を作成しました。
  update:
    success: 課題 {{title}} を更新しました。
  writeup_update:
    success: 課題 {{title}} の解答レポートを更新しました。
  instance_update:
    success: 課題 {{title}} の動的環境を更新しました。
  delete:
    _: 課題を削除
    message: 課題 <muted>{{title}}</muted> を削除してもよろしいですか？
    success: 課題 {{title}} を削除しました。
