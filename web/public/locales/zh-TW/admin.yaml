    script:
      _: 指令碼
      templates:
        _: 範本
        default: 預設
        oauth: OAuth 2.0
        cas: CAS
  actions:
    create:
      _: 建立第三方身分驗證服務
      success: "{{name}} 建立成功。"
    update:
      success: "{{name}} 更新成功。"
    enable:
      success: "{{name}} 已啟用。"
    disable:
      success: "{{name}} 已停用。"
    delete:
      _: 刪除第三方身分驗證服務
      message: "確定要刪除 <muted>{{name}}</muted> 嗎？"
      success: "{{name}} 刪除成功。"
