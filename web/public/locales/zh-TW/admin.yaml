idp:
  _: 第三方身分驗證
  empty: 尚未設定第三方身分驗證服務
  enabled:
    "true": 已啟用
    "false": 已停用
  avatar_upload:
    progress: "上傳進度 {{percent}}%"
    success: 頭像上傳成功。
    error: 頭像上傳失敗。
    size_error: 頭像大小超過 5 MB 限制。
  avatar_delete:
    success: 頭像移除成功。
  form:
    name:
      _: 名稱
      placeholder: GitHub
      message: 請輸入第三方身分驗證服務名稱。
    portal:
      _: 入口
      placeholder: https://example.com/oauth
    enabled:
      _: 啟用
