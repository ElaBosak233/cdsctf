    _: 公開狀態
    "true": 公開
    "false": 不公開
form:
  id:
    _: ID
  title:
    _: 標題
    message: 請輸入標題
    placeholder: Try hack me!
  category:
    _: 分類
    message: 請選擇分類
  tags:
    _: 標籤
  has_attachment:
    _: 是否有附件
    "true": 是
    "false": 否
  has_writeup:
    _: 是否提供解題報告
    "true": 是
    "false": 否
  writeup:
    _: 解題報告
    message: 請輸入解題報告
    placeholder: 很久很久以前…
  has_instance:
    _: 動態環境
    "true": 動態環境
    "false": 靜態環境
  description:
    _: 描述
    message: 請輸入描述
    placeholder: 很久很久以前…
  instance:
    duration:
      _: 持續時間（秒）
      message: 請輸入持續時間（秒）
      placeholder: "1800"
    internet:
      _: 是否允許存取網際網路
      message: 請選擇是否允許存取網際網路
      "true": 允許
      "false": 不允許
    containers:
      _: 容器
      image:
        _: 映像檔名稱
        message: 請輸入映像檔名稱
        placeholder: "repository:tag"
      cpu_limit:
        _: CPU 限制（核）
        message: 請輸入 CPU 限制（核）
      memory_limit:
        _: 記憶體限制（MB）
        message: 請輸入記憶體限制（MB）
      image_pull_policy:
        _: 映像檔拉取策略
        message: 請選擇映像檔拉取策略
        always: 一律拉取（Always）
        if_not_present: 僅在本機不存在時拉取（IfNotPresent）
        never: 從不拉取（Never）
      ports:
        _: 對外連接埠
        port:
          _: 連接埠
          message: 請輸入連接埠號碼
        protocol:
          _: 通訊協定
          tcp: TCP
          udp: UDP
      envs:
        _: 環境變數
        key:
          _: 變數名稱
          message: 請輸入變數名稱
        value:
          _: 變數值
          message: 請輸入變數值
      actions:
        delete: 刪除容器
        add: 新增容器
actions:
  _: 操作
  create:
    _: 建立題目
    success: "題目 {{title}} 建立成功。"
  update:
    success: "題目 {{title}} 更新成功。"
  writeup_update:
    success: "題目 {{title}} 解題報告更新成功。"
  instance_update:
    success: "題目 {{title}} 動態環境更新成功。"
  delete:
    _: 刪除題目
    message: "你確定要刪除題目 <muted>{{title}}</muted> 嗎？"
    success: "題目 {{title}} 刪除成功。"
