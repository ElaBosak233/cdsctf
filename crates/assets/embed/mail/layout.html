<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{subject}}</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    @media (max-width: 440px) {
      .gutter { padding: 24px 12px !important; }
      .brand { padding: 0 4px 16px !important; }
      .section { padding-right: 20px !important; padding-left: 20px !important; }
      .code { font-size: 16px !important; }
    }
    @media (prefers-color-scheme: dark) {
      .canvas { background-color: #181818 !important; }
      .card { background-color: #232323 !important; border-color: #404040 !important; }
      .brand, .heading { color: #f7f5f0 !important; }
      .copy { color: #dbd8d3 !important; }
      .code-box { background-color: #202d37 !important; border-color: #385367 !important; }
      .code, .label { color: #d5ecfc !important; }
      .footer { border-color: #404040 !important; color: #bdbab5 !important; }
    }
  </style>
</head>
<body class="canvas" style="margin:0;padding:0;background-color:#f4f2ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
  <table role="presentation" class="canvas" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f2ed;">
    <tr>
      <td class="gutter" align="center" style="padding:48px 24px;">
        <!--[if mso]><table role="presentation" width="520" align="center" cellspacing="0" cellpadding="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;">
          <tr>
            <td class="brand" style="padding:0 8px 18px;color:#252629;font-size:16px;line-height:24px;font-weight:700;overflow-wrap:anywhere;">
              <img src="cid:{{logo}}" alt="" width="28" height="28" style="vertical-align:middle;margin-right:8px;border:0;">
              <span style="vertical-align:middle;">{{platform}}</span>
            </td>
          </tr>
          <tr>
            <td>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" class="card" style="background-color:#fffefa;border:1px solid #e2ded6;border-radius:14px;">
                <tr>
                  <td class="section" style="padding:32px 32px 26px;text-align:left;overflow-wrap:anywhere;">
                    <h1 class="heading" style="margin:0 0 16px;color:#252629;font-size:28px;line-height:1.25;font-weight:700;">{{heading}}</h1>
                    <p class="copy" style="margin:0 0 6px;color:#4c4d52;font-size:15px;line-height:1.6;">{{greeting}}</p>
                    <p class="copy" style="margin:0 0 22px;color:#4c4d52;font-size:15px;line-height:1.6;">{{instruction}}</p>
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                      <tr>
                        <td class="code-box" style="padding:16px 18px;background-color:#ebf3f8;border:1px solid #d4e2eb;border-radius:8px;">
                          <p class="label" style="margin:0 0 6px;color:#31526a;font-size:13px;line-height:1.4;font-weight:600;">{{code_label}}</p>
                          <p class="code" dir="ltr" style="margin:0;color:#172e40;font-family:Consolas,'Liberation Mono',monospace;font-size:22px;line-height:1.4;font-weight:700;word-break:break-all;">{{code}}</p>
                        </td>
                      </tr>
                    </table>
                    <p class="copy" style="margin:12px 0 0;color:#4c4d52;font-size:13px;line-height:1.6;">{{expiry}}</p>
                  </td>
                </tr>
                <tr>
                  <td class="section footer" style="padding:16px 32px 18px;text-align:left;border-top:1px solid #e2ded6;color:#5a5b61;font-size:13px;line-height:1.6;">{{ignore}}</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
