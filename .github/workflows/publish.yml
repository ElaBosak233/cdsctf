name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout CdsCTF
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"
          version="$(awk -F '"' '/^\[workspace\.package\]/{found=1; next} found && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG_NAME' is not a stable semantic version (expected 1.2.3 or v1.2.3)." >&2
            exit 1
          fi

          if [[ "$tag" != "$version" ]]; then
            echo "Tag '$TAG_NAME' does not match Cargo workspace version '$version'." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKER_TOKEN != ''
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: elabosak233
          password: ${{ env.DOCKER_TOKEN }}

      - name: Select registries
        id: registries
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo 'images<<EOF'
            echo "ghcr.io/$owner/cdsctf"
            if [[ -n "$DOCKER_TOKEN" ]]; then
              echo 'docker.io/elabosak233/cdsctf'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=cdsctf
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            maintainer=ElaBosak233 <i@e23.dev>

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
